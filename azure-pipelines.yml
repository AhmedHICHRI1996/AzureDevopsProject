trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

variables:
- group: esprit  # DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD, MYSQL_USER, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD
- name: MAVEN_OPTS
  value: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'
- name: APP_NAME
  value: 'gestion-signalement'
- name: IMAGE_TAG
  value: '$(Build.BuildId)'
- name: DOCKERHUB_REPO
  value: 'ahmedhichri1996/gestion-signalement'
- name: APP_DIR
  value: '/home/ahmed/app'   # dossier docker-compose sur la VM locale

# ─────────────────────────────────────────────
# TOUS les stages tournent sur l'agent LOCAL
# pool: name: LocalVM  (le pool créé dans Azure DevOps)
# ─────────────────────────────────────────────JavaToolInstaller@0

stages:

# ─────────────────────────────────────────────
# STAGE 1 — BUILD & TEST
# MySQL tourne en service container sur l'agent local
# ─────────────────────────────────────────────
- stage: Build
  displayName: 'Build & Test'
  jobs:
  - job: BuildAndTest
    displayName: 'Maven Build + Tests'
    pool:
      name: Default    # agent auto-hébergé local

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: musee_signalement
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword

    steps:
    - script: |
        java -version
        mvn -version
      displayName: 'Vérifier Java & Maven'

    # - task: JavaToolInstaller@0
    #   displayName: 'Java 8'
    #   inputs:
    #     versionSpec: '8'
    #     jdkArchitectureOption: 'x64'
    #     jdkSourceOption: 'PreInstalled'

    - script: |
        echo "Waiting for MySQL..."
        for i in $(seq 1 30); do
          if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
            echo "MySQL ready!"
            break
          fi
          echo "Attempt $i: not ready, waiting 3s..."
          sleep 3
        done
      displayName: 'Attendre MySQL'

    - task: Maven@3
      displayName: 'Compilation'
      inputs:
        mavenPomFile: 'gestion-signalement-main/pom.xml'
        goals: 'compile'
        options: '$(MAVEN_OPTS)'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'

    - task: Maven@3
      displayName: 'Tests JUnit'
      inputs:
        mavenPomFile: 'gestion-signalement-main/pom.xml'
        goals: 'test'
        options: >
          $(MAVEN_OPTS)
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/musee_signalement?useSSL=false&allowPublicKeyRetrieval=true
          -Dspring.datasource.username=appuser
          -Dspring.datasource.password=apppassword
          -Dspring.jpa.hibernate.ddl-auto=create-drop
          -Dspring.profiles.active=test
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        testRunTitle: 'Tests - Gestion Signalement'
      continueOnError: true

    - task: PublishTestResults@2
      displayName: 'Publier résultats tests'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    - task: Maven@3
      displayName: 'Package JAR'
      inputs:
        mavenPomFile: 'gestion-signalement-main/pom.xml'
        goals: 'package'
        options: '$(MAVEN_OPTS) -DskipTests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.8'

    - task: CopyFiles@2
      displayName: 'Copier JAR'
      inputs:
        SourceFolder: 'gestion-signalement-main/target'
        Contents: '$(APP_NAME).jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: CopyFiles@2
      displayName: 'Copier Dockerfile'
      inputs:
        SourceFolder: 'gestion-signalement-main'
        Contents: 'Dockerfile'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publier artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

# ─────────────────────────────────────────────
# STAGE 2 — DOCKER BUILD & PUSH vers Docker Hub
# ─────────────────────────────────────────────
- stage: DockerBuild
  displayName: 'Docker Build & Push'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DockerJob
    displayName: 'Build & Push Docker Hub'
    pool:
      name: Default

    steps:
    - download: current
      artifact: drop

    - script: |
        cd $(Pipeline.Workspace)/drop
        echo "=== Build image Docker ==="
        docker build -t $(DOCKERHUB_REPO):$(IMAGE_TAG) -f Dockerfile .
        docker tag $(DOCKERHUB_REPO):$(IMAGE_TAG) $(DOCKERHUB_REPO):latest

        echo "=== Login Docker Hub ==="
        echo "$(DOCKERHUB_PASSWORD)" | docker login -u "$(DOCKERHUB_USERNAME)" --password-stdin

        echo "=== Push vers Docker Hub ==="
        docker push $(DOCKERHUB_REPO):$(IMAGE_TAG)
        docker push $(DOCKERHUB_REPO):latest
        echo "Image pushée : $(DOCKERHUB_REPO):$(IMAGE_TAG)"
      displayName: 'Build & Push'

# ─────────────────────────────────────────────
# STAGE 3 — DEPLOY sur la VM locale
# L'agent EST sur la VM, donc on execute docker-compose directement
# ─────────────────────────────────────────────
- stage: Deploy
  displayName: 'Deploy (docker-compose local)'
  dependsOn: DockerBuild
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployLocal
    displayName: 'docker-compose pull + up'
    pool:
      name: Default
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              set -e
              cd $(APP_DIR)

              echo "=== Pull nouvelle image depuis Docker Hub ==="
              docker pull $(DOCKERHUB_REPO):$(IMAGE_TAG)
              docker tag $(DOCKERHUB_REPO):$(IMAGE_TAG) $(DOCKERHUB_REPO):latest

              echo "=== Redémarrage du container app uniquement ==="
              docker-compose up -d --no-deps --pull always app

              echo "=== Nettoyage des vieilles images ==="
              docker image prune -f

              echo "=== Status des containers ==="
              docker-compose ps
            displayName: 'Deploy docker-compose'

          - script: |
              echo "Attente démarrage (30s)..."
              sleep 30
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
              echo "HTTP Status: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "Health check OK"
              else
                echo "Status $STATUS — logs:"
                docker logs gestion-signalement --tail=20
              fi
            displayName: 'Health Check'
            continueOnError: true